        <canvas id="myCanvas" width="512" height="512" style="
    padding: 0;
    margin: auto;
    display: block;
    width: 512px;
    height: 512px;
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0; image-rendering: pixelated; image-rendering: crisp-edges;">
        </canvas>

        <script>
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        var timer = 0;
        ctx.CanvasImageSmoothing = false;
        ctx.translate(0.5, 0.5)


        var then = 0;
        var time;
        var deltaTime;

        var decalSize = 64;

        function requestAnimFrame(time) {
        
        requestAnimationFrame(requestAnimFrame);
        deltaTime = time - then; 

        
        

        if ( deltaTime > 20) {
            
            then = time - (deltaTime % 20);

            timer = timer + 0.01;

            ctx.beginPath();
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.lineWidth = 5;
            ctx.moveTo(decalSize * Math.cos(timer) + c.width/2, decalSize * Math.sin(timer) + c.height/2);
           // ctx.lineTo(8 * Math.cos(num) + 128, 8 * Math.sin(num) + 128);
            ctx.lineTo(decalSize * Math.cos(timer + (Math.PI * 2)/3) + c.width/2, decalSize * Math.sin(timer + (Math.PI * 2)/3) + c.height/2);
            
            ctx.lineTo(1.5 * decalSize * Math.cos(timer + (Math.PI * 2)/3) + c.width/2, 1.5 * decalSize * Math.sin(timer + (Math.PI * 2)/3) + c.height/2);
            ctx.lineTo(0.5 * decalSize * Math.cos(timer + (Math.PI * 2)/3) + c.width/2, 0.5 * decalSize * Math.sin(timer + (Math.PI * 2)/3) + c.height/2);
            ctx.lineTo(decalSize * Math.cos(timer + (Math.PI * 2)/3) + c.width/2, decalSize * Math.sin(timer + (Math.PI * 2)/3) + c.height/2);


            ctx.lineTo(decalSize * Math.cos(timer + 2 * (Math.PI * 2)/3) + c.width/2, decalSize * Math.sin(timer + 2 * (Math.PI * 2)/3) + c.height/2);
            ctx.lineTo(1.5*decalSize * Math.cos(timer + 2 * (Math.PI * 2)/3) + c.width/2, 1.5*decalSize * Math.sin(timer + 2 * (Math.PI * 2)/3) + c.height/2);
            ctx.lineTo(0.5*decalSize * Math.cos(timer + 2 * (Math.PI * 2)/3) + c.width/2, 0.5*decalSize * Math.sin(timer + 2 * (Math.PI * 2)/3) + c.height/2);
            ctx.lineTo(decalSize * Math.cos(timer + 2 * (Math.PI * 2)/3) + c.width/2, decalSize * Math.sin(timer + 2 * (Math.PI * 2)/3) + c.height/2);


            
            ctx.lineTo(decalSize * Math.cos(timer) + c.width/2, decalSize * Math.sin(timer) + c.height/2);
            ctx.lineTo(1.5 * decalSize * Math.cos(timer) + c.width/2, 1.5*decalSize * Math.sin(timer) + c.height/2);
            ctx.lineTo(0.5*decalSize * Math.cos(timer) + c.width/2, 0.5*decalSize * Math.sin(timer) + c.height/2);
            ctx.lineTo(decalSize * Math.cos(timer) + c.width/2, decalSize * Math.sin(timer) + c.height/2);

            //ctx.moveTo(c.width/2 + 1, c.height/2 - 1);
            ctx.strokeRect(c.width/2, c.height/2,1,1);




            ctx.strokeStyle = "white";
            ctx.stroke();

        }


        } 
        requestAnimationFrame(requestAnimFrame); 
        
        </script>
