        <canvas id="myCanvas" width="256" height="256" style="text-align:center;">
        </canvas>

        <script>
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        var num = 0;
        var num2 = 0;

        function requestAnimFrame() {
        
        num2 = num2 + 1;
        num = Math.sin(num2 * 0.001) * 50;

        ctx.clearRect(0, 0, 256, 256);
        ctx.moveTo(0, 0);
        ctx.lineTo(200, num);
        ctx.stroke();
        } 
        requestAnimationFrame(requestAnimFrame);
